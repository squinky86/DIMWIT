name: Report dependency updates

on:
  schedule:
    - cron: '23 14 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: dependency-issues
  cancel-in-progress: false

jobs:
  report:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
      - name: Report available updates without changing code
        run: node scripts/check-dependencies.mjs --publish
        env:
          GH_TOKEN: ${{ github.token }}
          DEPENDENCY_ASSIGNEE: squinky86
