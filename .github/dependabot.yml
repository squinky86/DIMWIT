version: 2
updates:
  - package-ecosystem: bundler
    directory: /
    schedule:
      interval: weekly
      day: monday
    assignees: [squinky86]
    open-pull-requests-limit: 5
    groups:
      ruby-compatible:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    assignees: [squinky86]
    open-pull-requests-limit: 5
    groups:
      javascript-compatible:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    assignees: [squinky86]
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns: ['*']
